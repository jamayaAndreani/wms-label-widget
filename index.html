<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMS Location Label Generator</title>
<!-- IDS Enterprise CSS - compatible con temas de Infor -->
<style>
  /* ============================================================
     RESET & BASE — compatible con el iframe de Infor Homepages
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ids-color-brand-primary: #206FC4;
    --ids-color-brand-primary-alt: #1B5FA8;
    --widget-bg: #f5f5f5;
    --panel-bg: #ffffff;
    --panel-border: #e0e0e0;
    --label-text: #333333;
    --muted: #767676;
    --accent: #206FC4;
    --font-base: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  /* Dark theme support (Infor OS dark mode) */
  @media (prefers-color-scheme: dark) {
    :root {
      --widget-bg: #1a1a1a;
      --panel-bg: #242424;
      --panel-border: #3a3a3a;
      --label-text: #e0e0e0;
      --muted: #999;
    }
  }

  html, body {
    font-family: var(--font-base);
    font-size: 13px;
    background: var(--widget-bg);
    color: var(--label-text);
    height: 100%;
    overflow-x: hidden;
  }

  .widget-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    height: 100%;
  }

  /* ============================================================
     FORM CONTROLS
  ============================================================ */
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }

  .field { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 70px; }
  .field label {
    font-size: 10px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .field input, .field select {
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 5px 8px;
    font-size: 13px;
    font-family: 'Courier New', monospace;
    font-weight: 700;
    background: var(--panel-bg);
    color: var(--label-text);
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    text-transform: uppercase;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select { font-family: var(--font-base); font-weight: normal; }

  .sep { font-size: 20px; font-weight: 900; color: var(--accent); padding-bottom: 4px; align-self: flex-end; flex-shrink: 0; }

  .style-row {
    display: flex;
    gap: 6px;
  }
  .style-btn {
    flex: 1;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 6px 4px;
    cursor: pointer;
    font-size: 9px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    transition: all 0.15s;
    font-family: var(--font-base);
  }
  .style-btn:hover { border-color: var(--accent); color: var(--label-text); }
  .style-btn.active { border-color: var(--accent); color: var(--accent); background: #206FC415; font-weight: 700; }

  .dl-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 7px 14px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
    font-family: var(--font-base);
  }
  .dl-btn:hover { background: var(--ids-color-brand-primary-alt); }

  /* ============================================================
     LABEL PREVIEW
  ============================================================ */
  .preview-wrap {
    background: #9e9e9e;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 14px 10px;
    flex: 1;
    min-height: 180px;
  }

  /* ---------- STYLE 1: Industrial ---------- */
  .lbl-industrial {
    width: 340px;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    font-family: Arial, sans-serif;
    border: 2px solid #111;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  }
  .lbl-industrial .top-stripe { height: 5px; }
  .lbl-industrial .hdr {
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lbl-industrial .hdr-sub { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .lbl-industrial .hdr-tag { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  .lbl-industrial .body { padding: 10px 12px 6px; display: flex; gap: 10px; align-items: center; }
  .lbl-industrial .loc-block { flex: 1; }
  .lbl-industrial .loc-lbl { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #888; margin-bottom: 2px; }
  .lbl-industrial .loc-code { font-size: 34px; font-weight: 900; letter-spacing: 2px; line-height: 1; }
  .lbl-industrial .chips { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
  .lbl-industrial .chip { background: #f0f0f0; border-radius: 3px; padding: 2px 6px; font-size: 8px; letter-spacing: 0.5px; color: #555; text-transform: uppercase; }
  .lbl-industrial .chip b { font-weight: 900; }
  .lbl-industrial .bc-row { padding: 3px 12px 10px; text-align: center; }
  .lbl-industrial .bc-row img { max-width: 100%; height: 38px; }
  .lbl-industrial .bc-txt { font-size: 8px; color: #aaa; letter-spacing: 1px; font-family: monospace; margin-top: 1px; }

  /* ---------- STYLE 2: Bold Dark ---------- */
  .lbl-bold {
    width: 340px;
    background: #0d1117;
    border-radius: 8px;
    overflow: hidden;
    font-family: Arial, sans-serif;
    box-shadow: 0 3px 14px rgba(0,0,0,0.6);
  }
  .lbl-bold .stripe { height: 6px; }
  .lbl-bold .body { padding: 12px 14px; }
  .lbl-bold .loc-lbl { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 3px; }
  .lbl-bold .loc-code { font-size: 44px; font-weight: 900; letter-spacing: 3px; line-height: 1; color: #fff; margin-bottom: 10px; }
  .lbl-bold .chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .lbl-bold .chip { border: 1px solid #2a3a5a; border-radius: 3px; padding: 3px 8px; font-size: 9px; color: #8aa0c0; letter-spacing: 0.5px; text-transform: uppercase; }
  .lbl-bold .chip b { color: #fff; font-size: 10px; }
  .lbl-bold .bottom { display: flex; gap: 10px; align-items: flex-end; background: #060810; padding: 10px 14px; margin: 0 -14px -14px; }
  .lbl-bold .bc-wrap { flex: 1; }
  .lbl-bold .bc-wrap img { width: 100%; height: 38px; filter: invert(1); }
  .lbl-bold .bc-txt { font-size: 8px; letter-spacing: 1px; text-align: center; font-family: monospace; margin-top: 2px; }

  /* ---------- STYLE 3: Minimal ---------- */
  .lbl-minimal {
    width: 340px;
    background: #fafafa;
    border-radius: 3px;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    border: 1px solid #ddd;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .lbl-minimal .top { display: flex; }
  .lbl-minimal .accent-bar { width: 6px; flex-shrink: 0; }
  .lbl-minimal .top-content { flex: 1; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; }
  .lbl-minimal .loc-lbl { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #aaa; margin-bottom: 3px; }
  .lbl-minimal .loc-code { font-size: 36px; font-weight: 900; color: #111; letter-spacing: 3px; line-height: 1; }
  .lbl-minimal .meta { text-align: right; font-size: 9px; color: #aaa; }
  .lbl-minimal .meta div { margin-bottom: 2px; }
  .lbl-minimal .meta b { color: #555; }
  .lbl-minimal .bottom { border-top: 1px solid #eee; padding: 8px 14px; display: flex; gap: 10px; align-items: center; background: #f3f3f3; }
  .lbl-minimal .bc-wrap { flex: 1; }
  .lbl-minimal .bc-wrap img { width: 100%; height: 34px; }
  .lbl-minimal .bc-txt { font-size: 8px; color: #bbb; text-align: center; font-family: monospace; margin-top: 2px; }

  /* ---------- STYLE 4: Safety ---------- */
  .lbl-safety {
    width: 340px;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    font-family: Arial, sans-serif;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }
  .lbl-safety .zone-bar { padding: 6px 12px; display: flex; align-items: center; gap: 7px; }
  .lbl-safety .zone-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); flex-shrink: 0; }
  .lbl-safety .zone-txt { color: #fff; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
  .lbl-safety .body { padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
  .lbl-safety .loc-block { flex: 1; }
  .lbl-safety .loc-lbl { font-size: 8px; letter-spacing: 2px; color: #888; text-transform: uppercase; margin-bottom: 3px; }
  .lbl-safety .loc-code { font-size: 36px; font-weight: 900; letter-spacing: 2px; line-height: 1; }
  .lbl-safety .chips { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
  .lbl-safety .chip { border-radius: 3px; padding: 2px 7px; font-size: 8px; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 700; color: #fff; }
  .lbl-safety .bc-row { padding: 3px 12px 8px; text-align: center; }
  .lbl-safety .bc-row img { max-width: 100%; height: 36px; }
  .lbl-safety .bc-txt { font-size: 8px; color: #aaa; letter-spacing: 1px; font-family: monospace; margin-top: 1px; }
  .lbl-safety .bot-line { height: 6px; }

  /* ============================================================
     DIVIDER
  ============================================================ */
  .divider { height: 1px; background: var(--panel-border); }

</style>
</head>
<body>
<div class="widget-wrap">

  <!-- FILA 1: Código de ubicación -->
  <div class="row">
    <div class="field" style="max-width:72px;">
      <label>Pasillo</label>
      <input id="seg1" type="text" value="AII" maxlength="5" oninput="update()">
    </div>
    <div class="sep">—</div>
    <div class="field" style="max-width:72px;">
      <label>Rack</label>
      <input id="seg2" type="text" value="002" maxlength="5" oninput="update()">
    </div>
    <div class="sep">—</div>
    <div class="field" style="max-width:72px;">
      <label>Nivel</label>
      <input id="seg3" type="text" value="10" maxlength="5" oninput="update()">
    </div>
    <div class="field" style="max-width:120px;">
      <label>Zona</label>
      <select id="zone" onchange="update()">
        <option value="blue">🔵 Azul</option>
        <option value="orange">🟠 Naranja</option>
        <option value="green">🟢 Verde</option>
        <option value="red">🔴 Roja</option>
        <option value="purple">🟣 Morada</option>
        <option value="yellow">🟡 Amarilla</option>
      </select>
    </div>
  </div>

  <!-- FILA 2: Estilos -->
  <div class="style-row">
    <button class="style-btn active" onclick="setStyle('industrial',this)">🏗️ Industrial</button>
    <button class="style-btn" onclick="setStyle('bold',this)">⚡ Dark</button>
    <button class="style-btn" onclick="setStyle('minimal',this)">✦ Minimal</button>
    <button class="style-btn" onclick="setStyle('safety',this)">🎨 Safety</button>
  </div>

  <div class="divider"></div>

  <!-- PREVIEW -->
  <div class="preview-wrap">
    <div id="labelContainer"></div>
  </div>

  <!-- DESCARGAR -->
  <button class="dl-btn" onclick="downloadLabel()">⬇ Descargar etiqueta PNG</button>

</div>

<!-- Librerías -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
/* ============================================================
   DATOS
============================================================ */
let currentStyle = 'industrial';

const zones = {
  blue:   { bg: '#1a3a6e', accent: '#4a9eff', dark: '#0d2244', name: 'Zona Azul' },
  orange: { bg: '#8a4000', accent: '#ff8c2a', dark: '#5a2800', name: 'Zona Naranja' },
  green:  { bg: '#1a5a34', accent: '#00d46a', dark: '#0d3a20', name: 'Zona Verde' },
  red:    { bg: '#7a1a1a', accent: '#ff4a4a', dark: '#4a0d0d', name: 'Zona Roja' },
  purple: { bg: '#3a1a7a', accent: '#9a5aff', dark: '#220d4a', name: 'Zona Morada' },
  yellow: { bg: '#5a4800', accent: '#ffd600', dark: '#3a2e00', name: 'Zona Amarilla' },
};

/* ============================================================
   BUILDERS
============================================================ */
function buildIndustrial(code, s1, s2, s3, z) {
  const d = document.createElement('div');
  d.className = 'lbl-industrial';
  d.innerHTML = `
    <div class="top-stripe" style="background:linear-gradient(90deg,${z.accent},${z.bg});"></div>
    <div class="hdr" style="background:${z.bg};">
      <span class="hdr-sub">WMS · Almacén</span>
      <span class="hdr-tag" style="color:${z.accent};">Ubicación Rack</span>
    </div>
    <div class="body">
      <div class="loc-block">
        <div class="loc-lbl">Código de Ubicación</div>
        <div class="loc-code" style="color:${z.dark};">${code}</div>
        <div class="chips">
          <div class="chip"><b style="color:${z.dark}">${s1}</b> Pasillo</div>
          <div class="chip"><b style="color:${z.dark}">${s2}</b> Rack</div>
          <div class="chip"><b style="color:${z.dark}">${s3}</b> Nivel</div>
        </div>
      </div>
      <div id="qr-el"></div>
    </div>
    <div class="bc-row">
      <img id="bc-el">
      <div class="bc-txt">${code}</div>
    </div>`;
  return d;
}

function buildBold(code, s1, s2, s3, z) {
  const d = document.createElement('div');
  d.className = 'lbl-bold';
  d.style.border = `2px solid ${z.accent}33`;
  d.innerHTML = `
    <div class="stripe" style="background:linear-gradient(90deg,${z.accent},${z.bg});"></div>
    <div class="body">
      <div class="loc-lbl" style="color:${z.accent};">Ubicación en Rack</div>
      <div class="loc-code">${code}</div>
      <div class="chips">
        <div class="chip" style="border-color:${z.accent}44;"><b>${s1}</b> Pasillo</div>
        <div class="chip" style="border-color:${z.accent}44;"><b>${s2}</b> Rack</div>
        <div class="chip" style="border-color:${z.accent}44;"><b>${s3}</b> Nivel</div>
      </div>
      <div class="bottom">
        <div class="bc-wrap">
          <img id="bc-el">
          <div class="bc-txt" style="color:${z.accent}88;">${code}</div>
        </div>
        <div id="qr-el"></div>
      </div>
    </div>`;
  return d;
}

function buildMinimal(code, s1, s2, s3, z) {
  const d = document.createElement('div');
  d.className = 'lbl-minimal';
  d.innerHTML = `
    <div class="top">
      <div class="accent-bar" style="background:${z.accent};"></div>
      <div class="top-content">
        <div>
          <div class="loc-lbl">Ubicación</div>
          <div class="loc-code">${code}</div>
        </div>
        <div class="meta">
          <div>Pasillo: <b>${s1}</b></div>
          <div>Rack: <b>${s2}</b></div>
          <div>Nivel: <b>${s3}</b></div>
          <div id="qr-el" style="margin-top:6px;"></div>
        </div>
      </div>
    </div>
    <div class="bottom">
      <div class="bc-wrap">
        <img id="bc-el">
        <div class="bc-txt">${code}</div>
      </div>
    </div>`;
  return d;
}

function buildSafety(code, s1, s2, s3, z) {
  const d = document.createElement('div');
  d.className = 'lbl-safety';
  d.style.border = `3px solid ${z.accent}`;
  d.innerHTML = `
    <div class="zone-bar" style="background:${z.bg};">
      <div class="zone-dot"></div>
      <span class="zone-txt">${z.name}</span>
    </div>
    <div class="body">
      <div class="loc-block">
        <div class="loc-lbl">Código de Ubicación</div>
        <div class="loc-code" style="color:${z.dark};">${code}</div>
        <div class="chips">
          <div class="chip" style="background:${z.dark};">Pasillo: ${s1}</div>
          <div class="chip" style="background:${z.accent};">Rack: ${s2}</div>
          <div class="chip" style="background:${z.bg};">Nivel: ${s3}</div>
        </div>
      </div>
      <div id="qr-el"></div>
    </div>
    <div class="bc-row">
      <img id="bc-el">
      <div class="bc-txt">${code}</div>
    </div>
    <div class="bot-line" style="background:${z.accent};"></div>`;
  return d;
}

/* ============================================================
   RENDER
============================================================ */
function update() {
  const s1 = (document.getElementById('seg1').value || 'AII').toUpperCase();
  const s2 = (document.getElementById('seg2').value || '002').toUpperCase();
  const s3 = (document.getElementById('seg3').value || '10').toUpperCase();
  const zone = document.getElementById('zone').value;
  const code = `${s1}-${s2}-${s3}`;
  const z = zones[zone];

  const container = document.getElementById('labelContainer');
  container.innerHTML = '';

  let label;
  if      (currentStyle === 'industrial') label = buildIndustrial(code, s1, s2, s3, z);
  else if (currentStyle === 'bold')       label = buildBold(code, s1, s2, s3, z);
  else if (currentStyle === 'minimal')    label = buildMinimal(code, s1, s2, s3, z);
  else                                    label = buildSafety(code, s1, s2, s3, z);

  container.appendChild(label);

  setTimeout(() => {
    // Barcode
    const bcImg = label.querySelector('#bc-el');
    if (bcImg) {
      const canvas = document.createElement('canvas');
      try {
        JsBarcode(canvas, code, { format:'CODE128', width:2, height:50, displayValue:false, margin:4, background:'#ffffff' });
        bcImg.src = canvas.toDataURL();
      } catch(e) {}
    }
    // QR
    const qrEl = label.querySelector('#qr-el');
    if (qrEl) {
      qrEl.innerHTML = '';
      const isDark = currentStyle === 'bold';
      try {
        new QRCode(qrEl, {
          text: code,
          width: 64, height: 64,
          colorDark: isDark ? '#ffffff' : '#111111',
          colorLight: 'transparent',
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch(e) {}
    }
  }, 50);
}

function setStyle(s, btn) {
  currentStyle = s;
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  update();
}

function downloadLabel() {
  const labelEl = document.querySelector('#labelContainer > div');
  if (!labelEl) return;
  const s1 = document.getElementById('seg1').value.toUpperCase();
  const s2 = document.getElementById('seg2').value.toUpperCase();
  const s3 = document.getElementById('seg3').value.toUpperCase();
  html2canvas(labelEl, { scale: 3, useCORS: true, backgroundColor: null }).then(canvas => {
    const a = document.createElement('a');
    a.download = `etiqueta-${s1}-${s2}-${s3}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}

// Init
setTimeout(update, 200);
</script>
</body>
</html>
